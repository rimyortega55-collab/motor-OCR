<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0d0b" />
    <title>motor-OCR</title>
    <!-- El tema se resuelve antes del primer pintado. Si esperara al bundle,
         quien eligió el tema claro vería un parpadeo oscuro en cada carga.
         Duplica la lógica de src/tema.ts a propósito: es la única forma de que
         corra antes que React, y son cuatro líneas. -->
    <script>
      (function () {
        try {
          var elegido = localStorage.getItem('motor-ocr:tema')
          var claro =
            elegido === 'claro' ||
            ((!elegido || elegido === 'sistema') &&
              matchMedia('(prefers-color-scheme: light)').matches)
          if (claro) document.documentElement.setAttribute('data-theme', 'light')
        } catch (e) {
          /* sin localStorage queda el tema oscuro, que es el de :root */
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-DSO5rtHp.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CSkzDL9M.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
